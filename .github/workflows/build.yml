name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Signing key comes from repo secrets. Without them the build is signed with a
      # throwaway debug key, which installs fine but can't be updated in place later.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POPSHARE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/popshare.jks"
            echo "POPSHARE_KEYSTORE=$RUNNER_TEMP/popshare.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; APK is signed with a temporary debug key."
          fi

      - name: Version from tag or run number
        run: |
          # Offset keeps CI builds above the hand-built 0.1.x APKs (versionCode 1-2).
          echo "POPSHARE_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "POPSHARE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "POPSHARE_VERSION_NAME=0.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          POPSHARE_KEYSTORE_PASSWORD: ${{ secrets.POPSHARE_KEYSTORE_PASSWORD }}
          POPSHARE_KEY_ALIAS: ${{ secrets.POPSHARE_KEY_ALIAS }}
          POPSHARE_KEY_PASSWORD: ${{ secrets.POPSHARE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PopShare-${POPSHARE_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: PopShare-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
